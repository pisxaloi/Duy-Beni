<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mesaj Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 {
      font-size: 14px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #eab308;
      font-weight: 700;
      text-align: center;
    }
    .sentence-box {
      width: 100%;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .sentence-text {
      font-size: 26px;
      line-height: 1.6;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-weight: 500;
      transition: opacity 0.3s ease;
      max-width: 520px;
    }
    .sentence-text.fade {
      opacity: 0;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      background: rgba(234,179,8,0.15);
      border: 1px solid rgba(234,179,8,0.3);
      color: #eab308;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .btn:hover { background: rgba(234,179,8,0.25); }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-primary {
      background: #eab308;
      color: #0a0a0a;
      border-color: #eab308;
    }
    .btn-primary:hover { background: #facc15; }
    .btn-whatsapp {
      background: #25D366;
      color: #fff;
      border-color: #25D366;
    }
    .btn-whatsapp:hover { background: #20bd5a; }
    .btn-share {
      background: rgba(255,255,255,0.1);
      color: #f0f0f0;
      border-color: rgba(255,255,255,0.2);
    }
    .btn-share:hover { background: rgba(255,255,255,0.18); }
    .share-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .share-row .btn {
      flex: 1;
      min-width: 120px;
      text-align: center;
      font-size: 12px;
      padding: 10px 16px;
    }
    .progress {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }
    .status {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
    .timing-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .timing-controls summary {
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }
    .timing-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .timing-row input {
      flex: 1;
      accent-color: #eab308;
    }
    .timing-row span {
      min-width: 40px;
      text-align: right;
      font-family: monospace;
    }
    .weight-mode-note {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      text-align: center;
      padding: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    @media (max-width: 480px) {
      .sentence-text { font-size: 22px; }
      .sentence-box { min-height: 160px; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mesajlar Nasıl Üretiliyor</h1>

    <div class="sentence-box">
      <div id="sentenceDisplay" class="sentence-text">Ses dosyasını yüklemek için başlat'a tıkla</div>
    </div>

    <div class="controls">
      <button id="playBtn" class="btn btn-primary">▶ Başlat</button>
      <button id="resetBtn" class="btn">⟳ Sıfırla</button>
    </div>

    <div id="progressDisplay" class="progress">Cümle 0 / 41</div>
    <div id="statusDisplay" class="status">Hazır</div>

    <!-- PAYLAŞIM BUTONLARI -->
    <div class="share-row" id="shareRow" style="display:none;">
      <button id="whatsappBtn" class="btn btn-whatsapp">📱 WhatsApp'ta Paylaş</button>
      <button id="shareBtn" class="btn btn-share">📤 Paylaş</button>
      <button id="copyBtn" class="btn btn-share">📋 Kopyala</button>
    </div>

    <details class="timing-controls">
      <summary>⚙ Zamanlama Ayarları</summary>
      <div class="timing-row">
        <label>Hız Çarpanı:</label>
        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" />
        <span id="speedLabel">1.0×</span>
      </div>
      <div class="weight-mode-note">
        Zaman damgaları JSON'da elle doldurulana kadar,<br>
        cümle uzunluğuna göre otomatik zamanlama kullanılır.
      </div>
    </details>
  </div>

  <script>
    // ===== CÜMLE DİZİSİ =====
    const CUMLELER = [
      "Her sabah sistem astronomik takvime bakar.",
      "Otuz altı dekandan bugün aktif olanı belirlenir.",
      "Ardından kullanıcının ilk girişte seçtiği manifestoyu, yani Persona'sını okur.",
      "Bunun tersini hesaplayarak Gölge Hipotezini çıkarır: kişinin bastırdığı şey, sakladığı korku.",
      "Burada Jung devreye girer.",
      "Gölge, insanın neyi saklarsa onun kölesi olacağı fikri, sistemin temelidir.",
      "Sonra sistem, bugünün dekanını Piramit Altı Metinler'deki ortak sesle eşleştirir.",
      "Ardından Unas Piramidi'ndeki 283 cümle devreye girer.",
      "Bu cümleler, ölümden sonra ruhun karşılaştığı kapıları ve engelleri fısıldayan en eski dini metinlerdir.",
      "Sistem her mesaja bu cümlelerden birinin ritmini işler.",
      "Asla alıntı yapmaz.",
      "Sadece varoluşsal gerilimi kullanır.",
      "Algoritma tüm bunları birleştirir.",
      "Sonra yasaklı kelime filtresi gelir.",
      "\"Meli, malı, vaktidir, zamanı geldi, yapmalısın\" gibi tüm buyurgan ekler engellenir.",
      "Ve Sokrates'in yöntemiyle... soru sor, cevap verme... cümle en heyecanlı, en çelişkili yerinde kesilir.",
      "Sokaktan Konfüçyüs de oradadır.",
      "Mahalle duvarında tebeşirle yazar.",
      "Cümleleri asla tamamlanmaz.",
      "Çünkü tamamlanmış cümle insanı tembelleştirir.",
      "Kant ise arkada fısıldar: \"Aklını kendi kendine kullanma cesaretini göster.\"",
      "Ama bu sistemde sana cesaret verecek kimse yoktur.",
      "Elini tutacak öğretmen yoktur.",
      "Özgürlük, kimsenin sana ne yapacağını söylememesidir.",
      "Üretilen her mesaj şu sırayla yapılandırılır:",
      "Birinci: Günün Eylemi.",
      "Küçük, somut, yapılabilir bir şey.",
      "Felsefi bir tavsiye değil; fark etme çağrısı.",
      "İkinci: Eylemin arkasındaki kadim İŞLEYİŞ'i ve zihnin sakladığı gerçeği görmeye çağıran bir cümle.",
      "Üçüncü: \"İŞLEYİŞ'e İn & Köprüyü Geç\" başlığı altında Günün İşareti.",
      "Dördüncü: Gölge Yazıt.",
      "Kullanıcının fark etmediği, bastırdığı bir gerçeği sorgulatan cümle.",
      "Beşinci ve son: Gölge Keşfi.",
      "Sistem, Jung'u, Piramit Altı Metinler'i, Unas'ın 283 cümlesini ve o günün dekanını birleştirir.",
      "Ardından Sokratik kesme ile cümle yarım bırakılır.",
      "Ve şöyle biter: \"Ve sen o anı...\"",
      "Sistem asla cevap vermez.",
      "Sadece gösterir.",
      "Ürettiği her mesaj yarım kalır.",
      "Kalan sana kalmıştır.",
      "Ve sen o anı..."
    ];

    // ===== DOM REFS =====
    const sentenceDisplay = document.getElementById('sentenceDisplay');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressDisplay = document.getElementById('progressDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const shareRow = document.getElementById('shareRow');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const shareBtn = document.getElementById('shareBtn');
    const copyBtn = document.getElementById('copyBtn');

    // ===== STATE =====
    let audio = null;
    let currentIndex = -1;
    let isPlaying = false;
    let rafId = null;
    let timings = [];

    // ===== ZAMANLAMA HESAPLAMA =====
    function getWeight(text) {
      return text.length + (text.split(/[.,!?]/).length - 1) * 15;
    }

    function calculateTimings(duration) {
      const weights = CUMLELER.map(t => getWeight(t));
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let cumulative = 0;
      return weights.map(w => {
        const time = cumulative;
        cumulative += (w / totalWeight) * duration;
        return time;
      });
    }

    // ===== CÜMLE GÖSTER =====
    function showSentence(index) {
      if (index >= 0 && index < CUMLELER.length) {
        sentenceDisplay.textContent = CUMLELER[index];
        sentenceDisplay.classList.remove('fade');
        progressDisplay.textContent = `Cümle ${index + 1} / ${CUMLELER.length}`;
        shareRow.style.display = 'flex';
      } else if (index >= CUMLELER.length) {
        sentenceDisplay.textContent = '✓ Tamamlandı';
        progressDisplay.textContent = `Tamamlandı`;
        shareRow.style.display = 'none';
      } else {
        sentenceDisplay.textContent = 'Ses bekleniyor...';
        progressDisplay.textContent = `Cümle 0 / ${CUMLELER.length}`;
        shareRow.style.display = 'none';
      }
    }

    // ===== SENKRONİZASYON DÖNGÜSÜ =====
    function syncLoop() {
      if (!audio || audio.paused || audio.ended) return;

      const speed = parseFloat(speedSlider.value);
      const currentTime = audio.currentTime;

      // Hangi cümlede olduğumuzu bul
      let newIndex = -1;
      for (let i = timings.length - 1; i >= 0; i--) {
        if (currentTime >= timings[i]) {
          newIndex = i;
          break;
        }
      }

      if (newIndex !== currentIndex) {
        currentIndex = newIndex;
        showSentence(currentIndex);
      }

      rafId = requestAnimationFrame(syncLoop);
    }

    // ===== SESİ BAŞLAT =====
    let loadingPromise = null;

    async function startPlayback() {
      if (isPlaying) return;
      // Eğer zaten bir yükleme devam ediyorsa bekleme
      if (loadingPromise) {
        statusDisplay.textContent = '⏳ Ses yükleniyor...';
        return;
      }

      try {
        playBtn.disabled = true;
        statusDisplay.textContent = '⏳ Ses yükleniyor...';

        // Önceki ses varsa temizle
        if (audio) {
          audio.pause();
          audio.src = '';
          audio = null;
        }
        if (rafId) cancelAnimationFrame(rafId);

        // Ses dosyasını yükle
        loadingPromise = fetch('/mesajlar.mp3');
        const response = await loadingPromise;
        loadingPromise = null;
        if (!response.ok) throw new Error('Ses dosyası bulunamadı: /mesajlar.mp3');
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        audio = new Audio(url);
        audio.preload = 'auto';

        // Metadata yüklendiğinde zamanlamaları hesapla
        audio.addEventListener('loadedmetadata', () => {
          const duration = audio.duration;
          timings = calculateTimings(duration);
          statusDisplay.textContent = `Ses süresi: ${duration.toFixed(1)}sn · ${CUMLELER.length} cümle`;
        });

        // Ses bittiğinde
        audio.addEventListener('ended', () => {
          isPlaying = false;
          currentIndex = CUMLELER.length;
          showSentence(currentIndex);
          playBtn.textContent = '▶ Başlat';
          playBtn.disabled = false;
          statusDisplay.textContent = 'Tamamlandı';
          if (rafId) cancelAnimationFrame(rafId);
        });

        audio.addEventListener('error', (e) => {
          console.error('Audio error:', e);
          statusDisplay.textContent = '❌ Ses dosyası yüklenemedi';
          isPlaying = false;
          playBtn.textContent = '▶ Başlat';
          playBtn.disabled = false;
        });

        // Oynatmayı başlat
        await audio.play();
        isPlaying = true;
        currentIndex = -1;
        playBtn.textContent = '⏸ Durdur';
        playBtn.disabled = false;
        statusDisplay.textContent = 'Oynatılıyor...';

        // Senkron döngüsünü başlat
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(syncLoop);

      } catch (err) {
        console.error('Playback error:', err);
        statusDisplay.textContent = '❌ Hata: ' + err.message;
        playBtn.textContent = '▶ Başlat';
        playBtn.disabled = false;
        isPlaying = false;
        loadingPromise = null;
      }
    }

    // ===== DURDUR =====
    function stopPlayback() {
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
      isPlaying = false;
      if (rafId) cancelAnimationFrame(rafId);
      playBtn.textContent = '▶ Başlat';
      playBtn.disabled = false;
    }

    // ===== SIFIRLA =====
    function resetAll() {
      stopPlayback();
      currentIndex = -1;
      showSentence(-1);
      statusDisplay.textContent = 'Hazır';
      if (audio) {
        audio.src = '';
        audio = null;
      }
    }

    // ===== PAYLAŞIM FONKSİYONLARI =====
    function getCurrentSentence() {
      if (currentIndex >= 0 && currentIndex < CUMLELER.length) {
        return CUMLELER[currentIndex];
      }
      return '';
    }

    function getShareText() {
      const sentence = getCurrentSentence();
      if (!sentence) return 'Duy Beni — Mısır Mitolojisi ve Felsefe';
      return `"${sentence}"\n\n— Duy Beni`;
    }

    function shareViaWhatsApp() {
      const text = encodeURIComponent(getShareText());
      const url = `https://wa.me/?text=${text}`;
      window.open(url, '_blank');
    }

    function shareNative() {
      const text = getShareText();
      if (navigator.share) {
        navigator.share({
          title: 'Duy Beni',
          text: text,
          url: window.location.href,
        }).catch(err => {
          if (err.name !== 'AbortError') {
            console.error('Share error:', err);
            statusDisplay.textContent = '❌ Paylaşım başarısız';
          }
        });
      } else {
        // Native share yoksa WhatsApp'a yönlendir
        shareViaWhatsApp();
      }
    }

    function copyToClipboard() {
      const text = getShareText();
      navigator.clipboard.writeText(text).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Kopyalandı!';
        statusDisplay.textContent = '📋 Metin kopyalandı!';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Copy error:', err);
        statusDisplay.textContent = '❌ Kopyalama başarısız';
      });
    }

    // ===== OLAY DİNLEYİCİLERİ =====
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
        statusDisplay.textContent = 'Durduruldu';
      } else {
        playBtn.disabled = true;
        startPlayback();
      }
    });

    resetBtn.addEventListener('click', resetAll);

    speedSlider.addEventListener('input', () => {
      speedLabel.textContent = speedSlider.value + '×';
    });

    // Paylaşım butonları
    whatsappBtn.addEventListener('click', shareViaWhatsApp);
    shareBtn.addEventListener('click', shareNative);
    copyBtn.addEventListener('click', copyToClipboard);

    // ===== BAŞLANGIÇ =====
    showSentence(-1);
    statusDisplay.textContent = 'Hazır — "Başlat"a tıkla ve sesin gelmesini bekle';
  </script>
</body>
</html>
