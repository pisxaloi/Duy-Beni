<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klan Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #000;
    font-family: 'Montserrat', sans-serif;
  }

  .invitation-card {
    width: 500px;
    height: 889px;
    position: relative;
    overflow: hidden;
    background: 
      radial-gradient(ellipse at 50% 20%, rgba(234, 179, 8, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(234, 179, 8, 0.02) 0%, transparent 50%),
      linear-gradient(180deg, #050505 0%, #0d0804 25%, #1a1008 50%, #0d0804 75%, #050505 100%);
  }

  /* Kadim papirüs doku efekti */
  .papyrus-texture {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(234, 179, 8, 0.1) 3px, rgba(234, 179, 8, 0.1) 4px);
    pointer-events: none;
    z-index: 1;
  }

  /* Izgara desen */
  .grid-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.025;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(234, 179, 8, 0.2) 30px, rgba(234, 179, 8, 0.2) 31px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(234, 179, 8, 0.2) 30px, rgba(234, 179, 8, 0.2) 31px);
    pointer-events: none;
    z-index: 1;
  }

  /* Üst altın çizgi */
  .top-ornament {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #eab308 15%, #fbbf24 50%, #eab308 85%, transparent 100%);
    box-shadow: 0 0 25px rgba(234, 179, 8, 0.5), 0 0 50px rgba(234, 179, 8, 0.2);
    z-index: 3;
  }

  /* Alt altın çizgi */
  .bottom-ornament {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #eab308 15%, #fbbf24 50%, #eab308 85%, transparent 100%);
    box-shadow: 0 0 25px rgba(234, 179, 8, 0.5), 0 0 50px rgba(234, 179, 8, 0.2);
    z-index: 3;
  }

  /* Kenar çizgileri */
  .edge-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    z-index: 3;
  }
  .edge-line.left { left: 0; background: linear-gradient(180deg, transparent 0%, rgba(234, 179, 8, 0.2) 15%, rgba(234, 179, 8, 0.4) 50%, rgba(234, 179, 8, 0.2) 85%, transparent 100%); }
  .edge-line.right { right: 0; background: linear-gradient(180deg, transparent 0%, rgba(234, 179, 8, 0.2) 15%, rgba(234, 179, 8, 0.4) 50%, rgba(234, 179, 8, 0.2) 85%, transparent 100%); }

  /* Köşe süslemeleri */
  .corner {
    position: absolute;
    width: 50px;
    height: 50px;
    z-index: 3;
    border-color: rgba(234, 179, 8, 0.35);
  }
  .corner.tl { top: 10px; left: 10px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner.tr { top: 10px; right: 10px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .corner.bl { bottom: 10px; left: 10px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .corner.br { bottom: 10px; right: 10px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  /* İç köşe vurguları */
  .corner-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(234, 179, 8, 0.3);
    z-index: 3;
  }
  .corner-dot.tl { top: 8px; left: 8px; }
  .corner-dot.tr { top: 8px; right: 8px; }
  .corner-dot.bl { bottom: 8px; left: 8px; }
  .corner-dot.br { bottom: 8px; right: 8px; }

  /* İçerik */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 45px;
    text-align: center;
  }

  /* Logo alanı */
  .logo-container {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid rgba(234, 179, 8, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    background: rgba(0, 0, 0, 0.6);
    position: relative;
  }
  .logo-container::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(234, 179, 8, 0.08);
  }
  .logo-container svg {
    width: 40px;
    height: 40px;
  }

  /* Göz sembolü */
  .eye-symbol {
    width: 56px;
    height: 40px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .eye-symbol svg { width: 100%; height: 100%; }

  /* Başlık */
  .title-line {
    font-size: 10px;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(234, 179, 8, 0.4);
    font-weight: 300;
    margin-bottom: 6px;
  }

  .main-title {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fbbf24 0%, #eab308 35%, #ca8a04 65%, #a16207 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
    line-height: 1;
    text-shadow: none;
    filter: drop-shadow(0 2px 4px rgba(234, 179, 8, 0.15));
  }

  .sub-title {
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.25);
    font-weight: 200;
    margin-bottom: 28px;
  }

  /* Ayırıcı */
  .divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.5), transparent);
    margin-bottom: 8px;
  }
  .divider-symbol {
    font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
    font-size: 16px;
    color: rgba(234, 179, 8, 0.2);
    margin-bottom: 20px;
    letter-spacing: 8px;
  }

  /* Davet metni */
  .invite-text {
    font-size: 13px;
    line-height: 2;
    color: rgba(255, 255, 255, 0.65);
    font-weight: 300;
    max-width: 370px;
    margin-bottom: 22px;
    letter-spacing: 0.3px;
  }
  .invite-text strong {
    color: #eab308;
    font-weight: 600;
  }

  /* İsim alanı */
  .name-field {
    border: 1px solid rgba(234, 179, 8, 0.2);
    background: rgba(234, 179, 8, 0.03);
    padding: 10px 35px;
    margin-bottom: 22px;
    min-width: 220px;
    position: relative;
  }
  .name-field::before,
  .name-field::after {
    content: '✦';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 8px;
    color: rgba(234, 179, 8, 0.2);
  }
  .name-field::before { left: 10px; }
  .name-field::after { right: 10px; }
  .name-field span {
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(234, 179, 8, 0.5);
    font-weight: 400;
  }

  /* Buton */
  .join-button {
    display: inline-block;
    padding: 13px 45px;
    border: 1px solid rgba(234, 179, 8, 0.35);
    background: linear-gradient(180deg, rgba(234, 179, 8, 0.1) 0%, rgba(234, 179, 8, 0.02) 100%);
    color: #eab308;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .join-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.05), transparent);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  /* Hiyeroglif sırası */
  .hieroglyph-row {
    display: flex;
    gap: 14px;
    margin-bottom: 12px;
    opacity: 0.12;
    font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
    font-size: 18px;
    color: #eab308;
  }

  /* Alt bilgi */
  .footer-text {
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.1);
    font-weight: 200;
    text-transform: uppercase;
    margin-top: auto;
  }

  /* Işık hüzmeleri */
  .light-glow {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .light-glow.top {
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(234, 179, 8, 0.05) 0%, transparent 70%);
  }
  .light-glow.bottom {
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 150px;
    background: radial-gradient(ellipse, rgba(234, 179, 8, 0.03) 0%, transparent 70%);
  }

  /* Versiyon */
  .version {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-size: 6px;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.04);
    z-index: 3;
  }

  /* Mühür */
  .seal {
    position: absolute;
    bottom: 50px;
    right: 40px;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(234, 179, 8, 0.08);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0.15;
  }
  .seal svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <div class="invitation-card" id="card">
    <!-- Dokular -->
    <div class="papyrus-texture"></div>
    <div class="grid-pattern"></div>
    <div class="light-glow top"></div>
    <div class="light-glow bottom"></div>
    
    <!-- Çerçeve -->
    <div class="top-ornament"></div>
    <div class="bottom-ornament"></div>
    <div class="edge-line left"></div>
    <div class="edge-line right"></div>
    
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    
    <div class="corner-dot tl"></div>
    <div class="corner-dot tr"></div>
    <div class="corner-dot bl"></div>
    <div class="corner-dot br"></div>

    <!-- Mühür -->
    <div class="seal">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="45" stroke="#eab308" stroke-width="0.5" fill="none"/>
        <path d="M50 15 L50 85 M15 50 L85 50" stroke="#eab308" stroke-width="0.3"/>
        <circle cx="50" cy="50" r="6" fill="#eab308" opacity="0.5"/>
      </svg>
    </div>

    <!-- İçerik -->
    <div class="content">
      <!-- Logo -->
      <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" stroke="#eab308" stroke-width="1" fill="none" opacity="0.6"/>
          <circle cx="50" cy="50" r="32" stroke="#eab308" stroke-width="0.5" fill="none" opacity="0.3"/>
          <path d="M50 12 L50 88 M12 50 L88 50" stroke="#eab308" stroke-width="0.5" opacity="0.2"/>
          <circle cx="50" cy="50" r="10" fill="#eab308" opacity="0.25"/>
          <circle cx="50" cy="50" r="4" fill="#eab308" opacity="0.4"/>
        </svg>
      </div>

      <!-- Göz sembolü -->
      <div class="eye-symbol">
        <svg viewBox="0 0 100 70" fill="none">
          <path d="M50 8 C18 8 2 35 2 35 C2 35 18 62 50 62 C82 62 98 35 98 35 C98 35 82 8 50 8Z" stroke="#eab308" stroke-width="1.2" fill="none" opacity="0.5"/>
          <circle cx="50" cy="35" r="14" stroke="#eab308" stroke-width="0.8" fill="none" opacity="0.3"/>
          <circle cx="50" cy="35" r="6" fill="#eab308" opacity="0.2"/>
          <circle cx="50" cy="35" r="2" fill="#eab308" opacity="0.3"/>
        </svg>
      </div>

      <!-- Başlık -->
      <div class="title-line">Kadim Sırlar Uyanıyor</div>
      <div class="main-title">UNAS & JUNG</div>
      <div class="sub-title">BİLİNÇ HALKASI</div>

      <div class="divider"></div>
      <div class="divider-symbol">𓂀 𓁹 𓂀</div>

      <!-- Davet metni -->
      <div class="invite-text">
        Seni <strong>kendi klanıma</strong>, kadim bilgelik öğretilerinde 
        bir yolculuğa davet ediyorum. Rüyaların ve içsel dünyanın 
        rehberliğinde <strong>kendi mitini keşfet</strong>.
      </div>

      <!-- İsim alanı -->
      <div class="name-field">
        <span>✦ İSİM ✦</span>
      </div>

      <!-- Buton -->
      <div class="join-button">Katılmak İçin Tıkla</div>

      <!-- Hiyeroglif sırası -->
      <div class="hieroglyph-row">
        <span>𓁹</span>
        <span>𓂀</span>
        <span>𓃒</span>
        <span>𓆣</span>
        <span>𓋴</span>
      </div>

      <!-- Alt bilgi -->
      <div class="footer-text">𓁹 Gören Göz Sana Bakıyor 𓁹</div>
    </div>

    <div class="version">✦ KADİM DAVETİYE ✦</div>
  </div>
</body>
</html>
